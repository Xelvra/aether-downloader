name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy stahovac

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked --extra dev
      - name: Coverage
        run: uv run pytest --cov=stahovac --cov-report=term-missing

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked --extra dev
      - name: Tests
        run: uv run pytest --ignore=tests/test_gui_web.py

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked --extra dev
      - name: Tests
        run: uv run pytest --ignore=tests/test_gui_web.py

  build:
    name: Build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked --extra dev
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1
      - name: Build onefile
        run: uv run python build.py --onefile
      - name: Verify binary
        run: ls -la dist/ && test -x dist/stahovac && echo "binary OK"
      - name: Smoke test binary (TLS/CA)
        run: |
          ./dist/stahovac --check --check-output check.json
          test "$(python -c 'import json;print(json.load(open("check.json"))["ok"])')" = "True"

  gui:
    name: GUI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked --extra dev
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: GUI tests
        run: uv run pytest tests/test_gui_web.py -q
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots
          path: .screenshots/

  security:
    name: Security audit (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: "-r"
