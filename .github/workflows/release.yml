name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stahovac-linux-x86_64
          - os: windows-latest
            artifact: stahovac-windows-x86_64
          - os: macos-latest
            artifact: stahovac-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked --extra dev
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg binutils libgl1
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Build onefile
        run: uv run python build.py --onefile
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/stahovac.exe "stage/${{ matrix.artifact }}.exe"
          else
            cp dist/stahovac "stage/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/* \
            --title "Aether Downloader $GITHUB_REF_NAME" \
            --generate-notes
