name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stahovac-linux-x86_64
            macos_app: false
            mirror_ffmpeg: true
          - os: windows-latest
            artifact: stahovac-windows-x86_64
            macos_app: false
            mirror_ffmpeg: true
          - os: macos-latest
            artifact: stahovac-macos-arm64
            macos_app: true
            mirror_ffmpeg: true
          - os: macos-15-intel
            artifact: stahovac-macos-x86_64
            macos_app: true
            mirror_ffmpeg: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked --extra dev
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg binutils libgl1
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Fetch FFmpeg for bundling (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv run python -c "from stahovac.core.ffmpeg import download_and_install; download_and_install()"
          test -x bin/ffmpeg || { echo "FFmpeg se nestáhl, build se ruší."; exit 1; }
      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.macos_app }}" = "true" ]; then
            uv run python build.py --onedir
          else
            uv run python build.py --onefile
          fi
      - name: Smoke test binary (TLS/CA + yt-dlp)
        shell: pwsh
        env:
          SMOKE_URL: "https://www.youtube.com/watch?v=jNQXAC9IVRw"
        run: |
          if ($env:RUNNER_OS -eq "Windows") {
            $bin = "dist/stahovac.exe"
          } elseif ($env:RUNNER_OS -eq "macOS") {
            $bin = "dist/stahovac.app/Contents/MacOS/stahovac"
            # Bez FFmpeg v PATH: ověří se přibalená binárka (sys._MEIPASS)
            # místo systémové instalace přes Homebrew.
            $env:PATH = "/usr/bin:/bin"
          } else {
            $bin = "dist/stahovac"
          }
          & $bin --check --check-url $env:SMOKE_URL --check-output "$PWD/check.json"
          $rc = $LASTEXITCODE
          if (Test-Path "$PWD/check.json") { Get-Content "$PWD/check.json" | Write-Output }
          if ($env:RUNNER_OS -eq "macOS") {
            $check = Get-Content "$PWD/check.json" -Raw | ConvertFrom-Json
            $ff = $check.results | Where-Object { $_.name -eq "ffmpeg" }
            if (-not $ff -or -not $ff.ok) {
              Write-Error "Přibalený FFmpeg nebyl nalezen (ffmpeg check selhal)."
              exit 1
            }
            # flet/PyInstaller ukládá binárky do Contents/Frameworks – kontrola,
            # že FFmpeg je uvnitř .app bundle, ne ze systému (Homebrew).
            if ($ff.detail -notmatch "stahovac\.app/Contents/") {
              Write-Error "FFmpeg nalezen mimo bundle: $($ff.detail)"
              exit 1
            }
          }
          exit $rc
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          if [ "${{ matrix.macos_app }}" = "true" ]; then
            ditto -c -k --keepParent dist/stahovac.app "stage/${{ matrix.artifact }}.app.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/stahovac.exe "stage/${{ matrix.artifact }}.exe"
          else
            cp dist/stahovac "stage/${{ matrix.artifact }}"
          fi
      - name: Stage FFmpeg mirror asset
        if: ${{ matrix.mirror_ffmpeg }}
        shell: bash
        run: |
          uv run python - <<'PY' || { echo "FFmpeg mirror asset se nepodařilo stáhnout – release pokračuje bez něj (runtime fallback na upstream)."; exit 0; }
          import hashlib
          from pathlib import Path
          from stahovac.core import ffmpeg
          url = ffmpeg._resolve_download_url()
          name = ffmpeg.mirror_asset_name()
          if not url or not name:
              print(f"Bez mirror assetu pro tuto platformu (url={url!r}, name={name!r}).")
              raise SystemExit(0)
          stage = Path("stage")
          stage.mkdir(exist_ok=True)
          dest = stage / name
          ffmpeg._download(url, dest, None, None)
          if not ffmpeg._looks_like_archive(dest) or dest.stat().st_size < 1_000_000:
              print(f"Mirror asset není platný archiv, přeskočeno: {name}")
              dest.unlink(missing_ok=True)
              raise SystemExit(0)
          digest = hashlib.sha256(dest.read_bytes()).hexdigest()
          (stage / f"{name}.sha256").write_text(f"{digest}  {name}\n", encoding="utf-8")
          print(f"Staged {name} ({dest.stat().st_size} B) sha256 {digest}")
          PY
      - name: Generate checksums
        shell: bash
        run: |
          cd stage && sha256sum * > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: stage/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Build release body
        run: |
          TAG="$GITHUB_REF_NAME"
          BASE="https://github.com/Xelvra/aether-downloader/releases/download/$TAG"
          BODY="body.md"
          {
            echo "## Stáhni si správný soubor"
            echo ""
            echo "- **Windows** → [stahovac-windows-x86_64.exe]($BASE/stahovac-windows-x86_64.exe)"
            echo "- **Linux** → [stahovac-linux-x86_64]($BASE/stahovac-linux-x86_64)"
            echo "- **macOS (Apple Silicon, M1 a novější)** → [stahovac-macos-arm64.app.zip]($BASE/stahovac-macos-arm64.app.zip)"
            echo "- **macOS (Intel)** → [stahovac-macos-x86_64.app.zip]($BASE/stahovac-macos-x86_64.app.zip)"
            echo ""
            echo "> macOS: rozbal ZIP a přesuň aplikaci **stahovac.app** do složky Aplikace. Při prvním spuštění ji povol (pravé tlačítko → Otevřít)."
            echo ""
            echo "## Ověření integrity (SHA256)"
            echo ""
            echo "<details>"
            echo "<summary>Kontrolní součty všech souborů</summary>"
            echo ""
            for f in artifacts/stahovac-*.sha256; do cat "$f"; done
            echo ""
            echo "</details>"
            echo ""
            echo "## Co jsou ostatní soubory"
            echo ""
            echo "- **\`ffmpeg-*\` a \`ffmpeg-*.sha256\`** – oficiální statické buildy FFmpeg. Aplikace si je stahuje sama z GitHubu (se SHA256 ověřením) – ručně je stahovat nemusíš."
            echo "- **Source code (zip / tar.gz)** – zdrojový kód pro vývojáře."
          } > "$BODY"
          cat "$BODY"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          for f in \
            artifacts/stahovac-windows-x86_64.exe \
            artifacts/stahovac-linux-x86_64 \
            artifacts/stahovac-macos-arm64.app.zip \
            artifacts/stahovac-macos-x86_64.app.zip \
            artifacts/ffmpeg-windows-x86_64-essentials.zip \
            artifacts/ffmpeg-windows-x86_64-essentials.zip.sha256 \
            artifacts/ffmpeg-macos.zip \
            artifacts/ffmpeg-macos.zip.sha256 \
            artifacts/ffmpeg-linux-x86_64-static.tar.xz \
            artifacts/ffmpeg-linux-x86_64-static.tar.xz.sha256; do
            if [ -f "$f" ]; then FILES="$FILES $f"; fi
          done
          gh release create "$GITHUB_REF_NAME" $FILES \
            --title "Aether Downloader $GITHUB_REF_NAME" \
            --notes-file body.md
